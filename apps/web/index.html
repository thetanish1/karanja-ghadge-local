<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AapnaCart – Everything local, delivered fresh</title>

    <!-- Google Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Web App Meta -->
    <meta name="application-name" content="AapnaCart" />
    <meta name="theme-color" content="#1b5e39" />
    <meta name="description" content="Shop from trusted stores around your town and get it at your doorstep." />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari & Home Screen Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AapnaCart" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Android WebAPK / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body class="bg-[#f8faf9] text-slate-900 antialiased select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[PWA] ServiceWorker registered with scope:', reg.scope),
            (err) => console.warn('[PWA] ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
